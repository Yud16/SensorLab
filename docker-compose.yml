version: '3'
# reference: https://www.emqx.com/en/blog/how-to-use-mqtt-in-nodejs
services:
  emqx1:
    image: emqx/emqx-enterprise:6.2.2
    container_name: emqx1
    environment:
    - "EMQX_NODE_NAME=emqx@node1.emqx.com"
    - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
    - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@node1.emqx.com,emqx@node2.emqx.com]"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 25s
      retries: 5
    networks:
      emqx-bridge:
        aliases:
        - node1.emqx.com
    ports:
      - 1883:1883
      - 8083:8083
      - 8084:8084
      - 8883:8883
      - 18083:18083
    volumes:
      - $PWD/emqx1_data:/opt/emqx/data


  # reference: https://oneuptime.com/blog/post/2026-02-08-how-to-run-timescaledb-in-docker-with-hypertables/view
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Disable TimescaleDB telemetry
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsadmin -d tsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      MQTT_HOST: emqx1
      MQTT_PORT: 1883
    depends_on:
      emqx1:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - default
      - emqx-bridge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"

  # simulator:
  #   build:
  #     context: .
  #     dockerfile: simulator/Dockerfile
  #   container_name: simulator
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     POSTGRES_HOST: timescaledb
  #     POSTGRES_PORT: 5432
  #     MQTT_HOST: emqx1
  #     MQTT_PORT: 1883
